<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com HTML5</title>
</head>
<body>
   <h1>Inserindo vídeos hospedados localmente</h1> 
   <p>Este vídeo está hospedados no meu próprio servidor.</p>

   <video width="560" poster="imagens/limoes-capa.png" controls autoplay loop>
        <source src="mídias/meu-video-MP4.mp4" type="video/mp4">
        <source src="mídias/meu-video-M4V.m4v" type="video/mp4">
        <source src="mídias/meu-video-WEBM.webm" type="video/webm">
        <source src="mídias/meu-video-OGV.ogv" type="video/ogv">
        <p>Seu navegador não tem compatibilidade com reprodução de vídeos.</p>
   </video>

   <h1>Inserindo vídeos do Youtube</h1>

   <iframe width="560" height="315" src="https://www.youtube.com/embed/MiiV9oI91U8?si=rUvmODJyXmiQhCYa" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
