<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando fundos com imagens</title>
    <style>
        body {
            background-image: url('imagens/wallpaper002.jpg');
        }

        .quadrado {
            display: inline-block;
            width: 300px;
            height: 300px;
            border: 10px solid black;
            border-radius: 10px;

        }

        #q1 {
            background-color: rgb(123, 143, 123);
        }

        #q2 {
            background: linear-gradient(to bottom, pink, yellow);
        }

        #q3 {
            background-image: url('imagens/pattern003.png');
        }
    </style>
</head>
<body>
    <h1 style="color: white;">Fundo imagem<h1>

    <div class="quadrado" id="q1"></div>

    <div class="quadrado" id="q2"></div>

    <div class="quadrado" id="q3"></div>
</body>
</html>
