<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesclagem de celúla</title>
</head>
    <style>

        table {
            border-collapse: collapse;
        }

        td {
            border: 1px solid darkgray;
            padding: 20px;
        }
    </style>
<body>
   <h1>Mesclagem de celúla</h1>
   <table>
      <tr>
          <td>A</td>
          <td colspan="3">B</td>
      </tr>
       <tr>
          <td>E</td>
          <td>F</td>
          <td>G</td>
          <td rowspan="3">H</td>
      </tr>
       <tr>
          <td>I</td>
          <td>J</td>
          <td>K</td>
      </tr>
       <tr>
          <td>M</td>
          <td>N</td>
          <td>P</td>
      </tr>
   </table>

</body>
</html>
